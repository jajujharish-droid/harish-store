<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harish Store</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f8}
header{display:flex;justify-content:space-between;padding:15px;background:black;color:white}
.container{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;padding:10px;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,0.1)}
.card img{width:100%;border-radius:10px}
.price{color:green;font-weight:bold}
button{width:100%;padding:10px;margin-top:5px;border:none;border-radius:8px}
.cart{background:orange;color:white}
.order{background:#25D366;color:white}
.page{position:fixed;top:0;left:0;width:100%;height:100%;background:white;display:none;padding:15px;overflow:auto}
input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ddd}
</style>

</head>

<body>

<header>
<div>🔥 Harish Store</div>
<div onclick="openCart()">🛒</div>
</header>

<input id="search" placeholder="Search..." onkeyup="search()" style="margin:10px;padding:10px;width:90%">

<div class="container" id="products"></div>

<!-- DETAIL -->
<div id="detail" class="page">
<button onclick="closePage()">← Back</button>
<img id="dimg">
<h3 id="dname"></h3>
<p id="dprice"></p>
<button class="cart" onclick="addToCart()">Add to Cart</button>
</div>

<!-- CART -->
<div id="cartPage" class="page">
<button onclick="closePage()">← Back</button>
<h3>Cart</h3>
<div id="cartItems"></div>
<h3 id="total"></h3>

<h3>Details</h3>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="address" placeholder="Address">

<button class="order" onclick="placeOrder()">Order</button>
</div>

<!-- ADMIN -->
<div id="adminPage" class="page">
<button onclick="closePage()">← Back</button>
<h3>Admin Panel</h3>

<input id="pname" placeholder="Product name">
<input id="pprice" placeholder="Price">
<input id="pimg" placeholder="Image URL">
<input id="pcat" placeholder="Category">

<button onclick="addProduct()">Add Product</button>
</div>

<script>

let products=JSON.parse(localStorage.getItem("products")||`[
{"name":"Shoes","price":499,"img":"https://images.unsplash.com/photo-1528701800489-20be3c4dbe3c","cat":"shoes"},
{"name":"Sneakers","price":599,"img":"https://images.unsplash.com/photo-1600185365926-3a2ce3cdb9eb","cat":"shoes"},
{"name":"Slippers","price":199,"img":"https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a","cat":"slippers"}
]`);

let selected=null;

// LOAD
function load(){
let html="";
products.forEach((p,i)=>{
html+=`
<div class="card" onclick="openDetail(${i})">
<img src="${p.img}">
<h4>${p.name}</h4>
<p class="price">₹${p.price}</p>
</div>`;
});
productsDiv.innerHTML=html;
localStorage.setItem("products",JSON.stringify(products));
}

// DETAIL
function openDetail(i){
selected=products[i];
dimg.src=selected.img;
dname.innerText=selected.name;
dprice.innerText="₹"+selected.price;
detail.style.display="block";
}

function closePage(){
detail.style.display="none";
cartPage.style.display="none";
adminPage.style.display="none";
}

// CART
function addToCart(){
let cart=JSON.parse(localStorage.getItem("cart")||"[]");
let f=cart.find(c=>c.name==selected.name);
if(f){f.qty++} else {cart.push({...selected,qty:1})}
localStorage.setItem("cart",JSON.stringify(cart));
alert("Added");
}

// OPEN CART
function openCart(){
cartPage.style.display="block";
loadCart();
}

// LOAD CART
function loadCart(){
let cart=JSON.parse(localStorage.getItem("cart")||"[]");
let html="";let total=0;

cart.forEach((c,i)=>{
total+=c.price*c.qty;
html+=`
<div>
${c.name} x${c.qty} = ₹${c.price*c.qty}
<button onclick="change(${i},1)">+</button>
<button onclick="change(${i},-1)">-</button>
</div>`;
});

cartItems.innerHTML=html;
totalText.innerText="Total: ₹"+total;
}

// QTY
function change(i,v){
let cart=JSON.parse(localStorage.getItem("cart"));
cart[i].qty+=v;
if(cart[i].qty<=0) cart.splice(i,1);
localStorage.setItem("cart",JSON.stringify(cart));
loadCart();
}

// ORDER
function placeOrder(){
let name=nameInput.value;
let phone=phoneInput.value;
let address=addressInput.value;
let cart=JSON.parse(localStorage.getItem("cart")||"[]");

let msg="Order:\n";
cart.forEach(c=>{
msg+=c.name+" x"+c.qty+"\n";
});
msg+="\n"+name+"\n"+phone+"\n"+address;

window.location.href="https://wa.me/9182059866?text="+encodeURIComponent(msg);
}

// ADMIN ACCESS (SECRET)
document.body.addEventListener("dblclick",()=>{
adminPage.style.display="block";
});

// ADD PRODUCT
function addProduct(){
products.push({
name:pname.value,
price:Number(pprice.value),
img:pimg.value,
cat:pcat.value
});
load();
}

// SEARCH
function search(){
let val=searchInput.value.toLowerCase();
let html="";
products.forEach((p,i)=>{
if(p.name.toLowerCase().includes(val)){
html+=`
<div class="card" onclick="openDetail(${i})">
<img src="${p.img}">
<h4>${p.name}</h4>
<p class="price">₹${p.price}</p>
</div>`;
}
});
productsDiv.innerHTML=html;
}

// INIT
load();

</script>

</body>
</html>
