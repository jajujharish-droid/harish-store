<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harish Store</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f8}
header{display:flex;justify-content:space-between;padding:15px;background:black;color:white}
.container{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;padding:10px;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,0.1)}
.card img{width:100%;border-radius:10px}
.price{color:green;font-weight:bold}
button{width:100%;padding:10px;margin-top:5px;border:none;border-radius:8px}
.cart{background:orange;color:white}
.order{background:#25D366;color:white}

.page{
position:fixed;top:0;left:0;width:100%;height:100%;
background:white;display:none;padding:15px
}

input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ddd}
</style>

</head>

<body>

<header>
<div>🔥 Harish Store</div>
<div id="userInfo" onclick="logout()">Login</div>
</header>

<!-- LOGIN PAGE -->
<div id="loginPage" class="page">
<h3>Login</h3>
<input id="username" placeholder="Username">
<input id="password" placeholder="Password" type="password">
<button onclick="login()">Login</button>
</div>

<div class="container" id="products"></div>

<!-- ADMIN -->
<div id="adminPage" class="page">
<button onclick="closePage()">← Back</button>
<h3>Admin Panel</h3>
<input id="pname" placeholder="Product name">
<input id="pprice" placeholder="Price">
<input id="pimg" placeholder="Image URL">
<button onclick="addProduct()">Add Product</button>
</div>

<script>

// PRODUCTS
let products=JSON.parse(localStorage.getItem("products")||`[
{"name":"Shoes","price":499,"img":"https://images.unsplash.com/photo-1528701800489-20be3c4dbe3c"},
{"name":"Sneakers","price":599,"img":"https://images.unsplash.com/photo-1600185365926-3a2ce3cdb9eb"}
]`);

function load(){
let html="";
products.forEach((p,i)=>{
html+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p class="price">₹${p.price}</p>
</div>`;
});
productsDiv.innerHTML=html;
localStorage.setItem("products",JSON.stringify(products));
}

// LOGIN SYSTEM
function login(){
let u=usernameInput.value;
let p=passwordInput.value;

if(u==="admin" && p==="1234"){
localStorage.setItem("user","admin");
loginPage.style.display="none";
updateUser();
alert("Admin Login");
}else{
alert("Wrong login");
}
}

// LOGOUT
function logout(){
localStorage.removeItem("user");
updateUser();
loginPage.style.display="block";
}

// CHECK LOGIN
function updateUser(){
let user=localStorage.getItem("user");

if(user==="admin"){
userInfo.innerText="Admin";
}else{
userInfo.innerText="Login";
}
}

// OPEN ADMIN (DOUBLE CLICK)
document.body.addEventListener("dblclick",()=>{
if(localStorage.getItem("user")==="admin"){
adminPage.style.display="block";
}else{
alert("Login first");
loginPage.style.display="block";
}
});

// ADD PRODUCT
function addProduct(){
products.push({
name:pname.value,
price:Number(pprice.value),
img:pimg.value
});
load();
}

// CLOSE PAGE
function closePage(){
adminPage.style.display="none";
loginPage.style.display="none";
}

// INIT
updateUser();
load();

</script>

</body>
</html>
