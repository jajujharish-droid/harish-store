
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harish Store</title>

<style>
body{margin:0;font-family:sans-serif;background:#f5f6fa}
header{background:#000;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}

.tabs{display:flex;gap:10px;padding:10px;background:#fff;overflow:auto}
.tabs button{padding:8px 12px;border:none;border-radius:20px;background:#ddd}

.container{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}

.card{background:#fff;padding:10px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
.card img{width:100%;border-radius:10px}

.price{color:green;font-weight:bold}

.page{
position:fixed;top:0;left:0;width:100%;height:100%;
background:#fff;display:none;padding:15px;overflow:auto
}

.close{background:red;color:#fff;padding:8px;border-radius:8px}

.slider{display:flex;overflow-x:auto;gap:10px}
.slider img{width:250px;border-radius:10px}

button{padding:10px;border:none;border-radius:8px;width:100%;margin-top:5px}
.cartBtn{background:orange;color:#fff}
.payBtn{background:#25D366;color:#fff}

input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ddd}
</style>
</head>

<body>

<header>
<div>🔥 Harish Store</div>
<div>
<span onclick="addProductAuto()">➕</span>
<span onclick="openCart()">🛒</span>
</div>
</header>

<input id="search" placeholder="Search..." onkeyup="searchProducts()" style="margin:10px;padding:10px;width:90%">

<div class="tabs">
<button onclick="filterProducts('all')">All</button>
<button onclick="filterProducts('shoes')">Shoes</button>
<button onclick="filterProducts('sneakers')">Sneakers</button>
<button onclick="filterProducts('slippers')">Slippers</button>
</div>

<div class="container" id="products"></div>

<!-- DETAIL -->
<div id="detail" class="page">
<button class="close" onclick="closeAll()">❌</button>

<div class="slider" id="gallery"></div>

<h2 id="dname"></h2>
<p id="dprice"></p>

<p>Sizes: 7,8,9,10</p>
<p>Colors: Black, White</p>

<button class="cartBtn" onclick="addToCart()">Add to Cart</button>
<button onclick="payNow()">Pay via UPI</button>
</div>

<!-- CART -->
<div id="cartPage" class="page">
<button class="close" onclick="closeAll()">❌</button>
<h2>Cart</h2>

<div id="cartItems"></div>
<h3 id="total"></h3>

<input id="name" placeholder="Name">
<input id="address" placeholder="Address">

<button class="payBtn" onclick="order()">Order via WhatsApp</button>
</div>

<script>

// LOAD PRODUCTS (AUTO STORAGE)
let products = JSON.parse(localStorage.getItem("products")) || [
{
name:"Shoes",
price:499,
cat:"shoes",
images:["https://images.unsplash.com/photo-1528701800489-20be3c4dbe3c"]
},
{
name:"Sneakers",
price:599,
cat:"sneakers",
images:["https://images.unsplash.com/photo-1600185365926-3a2ce3cdb9eb"]
},
{
name:"Slippers",
price:199,
cat:"slippers",
images:["https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a"]
}
];

let selected=null;

// SAVE
function saveProducts(){
localStorage.setItem("products",JSON.stringify(products));
}

// LOAD UI
function loadProducts(list=products){
let html="";
list.forEach((p,i)=>{
html+=`
<div class="card" onclick="openDetail(${i})">
<img src="${p.images[0]}">
<h4>${p.name}</h4>
<p class="price">₹${p.price}</p>
</div>`;
});
document.getElementById("products").innerHTML=html;
}

// FILTER
function filterProducts(cat){
if(cat==="all") loadProducts(products);
else loadProducts(products.filter(p=>p.cat===cat));
}

// SEARCH
function searchProducts(){
let val=document.getElementById("search").value.toLowerCase();
let filtered=products.filter(p=>p.name.toLowerCase().includes(val));
loadProducts(filtered);
}

// DETAIL
function openDetail(i){
selected=products[i];

let gallery="";
selected.images.forEach(img=>{
gallery+=`<img src="${img}">`;
});

document.getElementById("gallery").innerHTML=gallery;
document.getElementById("dname").innerText=selected.name;
document.getElementById("dprice").innerText="₹"+selected.price;

document.getElementById("detail").style.display="block";
}

// CLOSE
function closeAll(){
document.getElementById("detail").style.display="none";
document.getElementById("cartPage").style.display="none";
}

// CART
function addToCart(){
let cart=JSON.parse(localStorage.getItem("cart")||"[]");

let f=cart.find(c=>c.name===selected.name);
if(f){f.qty++}
else{cart.push({...selected,qty:1})}

localStorage.setItem("cart",JSON.stringify(cart));
alert("Added to cart");
}

// OPEN CART
function openCart(){
document.getElementById("cartPage").style.display="block";
loadCart();
}

// LOAD CART
function loadCart(){
let cart=JSON.parse(localStorage.getItem("cart")||"[]");

let html="";let total=0;

cart.forEach((c,i)=>{
total+=c.price*c.qty;

html+=`
<div>
${c.name} x${c.qty} = ₹${c.price*c.qty}
<button onclick="changeQty(${i},1)">+</button>
<button onclick="changeQty(${i},-1)">-</button>
</div>`;
});

document.getElementById("cartItems").innerHTML=html;
document.getElementById("total").innerText="Total ₹"+total;
}

// QTY
function changeQty(i,v){
let cart=JSON.parse(localStorage.getItem("cart"));
cart[i].qty+=v;

if(cart[i].qty<=0) cart.splice(i,1);

localStorage.setItem("cart",JSON.stringify(cart));
loadCart();
}

// PAYMENT
function payNow(){
window.location.href="upi://pay?pa=9182059866-2@ybl&pn=HarishStore&am="+selected.price;
}

// ORDER
function order(){
let name=document.getElementById("name").value;
let address=document.getElementById("address").value;

let cart=JSON.parse(localStorage.getItem("cart")||"[]");

let msg="Order:\n";
cart.forEach(c=>msg+=c.name+" x"+c.qty+"\n");

msg+="\n"+name+"\n"+address;

window.location.href="https://wa.me/9182059866?text="+encodeURIComponent(msg);
}

// AUTO ADD PRODUCT
function addProductAuto(){
let name=prompt("Product name");
let price=prompt("Price");
let image=prompt("Image URL");
let cat=prompt("Category (shoes/sneakers/slippers)");

if(!name||!price||!image){
alert("Fill properly");
return;
}

products.push({
name:name,
price:Number(price),
cat:cat||"shoes",
images:[image]
});

saveProducts();
loadProducts();

alert("Product added!");
}

// INIT
loadProducts();

</script>

</body>
</html>
