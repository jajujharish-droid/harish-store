<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harish Store</title>

<style>
body{margin:0;font-family:sans-serif;background:#f5f6fa}
header{background:#000;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}
.container{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;padding:10px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
.card img{width:100%;border-radius:10px}
.price{color:green;font-weight:bold}
button{width:100%;padding:10px;margin-top:5px;border:none;border-radius:8px}
.cartBtn{background:orange;color:#fff}
.payBtn{background:#25D366;color:#fff}
.tabs{display:flex;gap:10px;padding:10px}
.tabs button{border:none;padding:8px 12px;border-radius:20px;background:#ddd}
.page{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;display:none;padding:15px;overflow:auto}
.slider{display:flex;gap:10px;overflow:auto}
.slider img{width:250px;border-radius:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ddd}
.close{background:red;color:white}
</style>
</head>

<body>

<header>
<div id="title">🔥 Harish Store</div>
<div>
<span onclick="shareSite()">📤</span>
<span onclick="openCart()">🛒</span>
<span id="addBtn" onclick="addProductAuto()" style="display:none">➕</span>
</div>
</header>

<div class="tabs">
<button onclick="filterProducts('all')">All</button>
<button onclick="filterProducts('shoes')">Shoes</button>
<button onclick="filterProducts('sneakers')">Sneakers</button>
<button onclick="filterProducts('slippers')">Slippers</button>
</div>

<div class="container" id="products"></div>

<!-- DETAIL -->
<div id="detail" class="page">
<button class="close" onclick="closeAll()">❌ Back</button>

<div class="slider" id="gallery"></div>

<h2 id="dname"></h2>
<p id="dprice"></p>

<select id="size"></select>
<select id="color"></select>

<input type="number" id="qty" value="1" min="1">

<button class="cartBtn" onclick="addToCart()">Add to Cart</button>
<button onclick="payNow()">Pay via UPI</button>
</div>

<!-- CART -->
<div id="cartPage" class="page">
<button class="close" onclick="closeAll()">❌ Back</button>

<h2>Cart</h2>
<div id="cartItems"></div>
<h3 id="total"></h3>

<input id="name" placeholder="Name">
<input id="address" placeholder="Address (Armoor only)">

<button class="payBtn" onclick="order()">Order via WhatsApp</button>
</div>

<script>

let isAdmin = false;
const ADMIN_PIN = "1234";

// SECRET ADMIN
let tapCount = 0;
let lastTap = 0;

document.getElementById("title").addEventListener("click", function(){
let now = new Date().getTime();

if(now - lastTap < 500){ tapCount++; } 
else{ tapCount = 1; }

lastTap = now;

if(tapCount === 5){
let pin = prompt("Enter Admin PIN");
if(pin === ADMIN_PIN){
isAdmin = true;
alert("Admin mode ON");
document.getElementById("addBtn").style.display = "inline";
loadProducts();
}else{
alert("Wrong PIN");
}
tapCount = 0;
}
});

// SHARE
function shareSite(){
let url = window.location.href;
if(navigator.share){
navigator.share({title:"Harish Store",text:"Check my store",url:url});
}else{
window.open("https://wa.me/?text="+encodeURIComponent(url));
}
}

// PRODUCTS
let products = JSON.parse(localStorage.getItem("products")) || [
{
name:"Duke Shoes",
price:1295,
cat:"shoes",
sizes:["7","8","9"],
colors:["Black","White"],
images:["https://images.unsplash.com/photo-1528701800489-20be3c4dbe3c?auto=format&fit=crop&w=800&q=80"]
}
];

let selected=null;

// SAVE
function saveProducts(){
localStorage.setItem("products",JSON.stringify(products));
}

// LOAD
function loadProducts(list=products){
let html="";
list.forEach((p,i)=>{
html+=`
<div class="card" onclick="openDetail(${i})">
<img src="${p.images[0]}">
<h4>${p.name}</h4>
<p class="price">₹${p.price}</p>
${isAdmin ? `<button onclick="event.stopPropagation(); removeProduct(${i})">Delete</button>` : ""}
</div>`;
});
document.getElementById("products").innerHTML=html;
}

// DETAIL
function openDetail(i){
selected=products[i];

let gallery="";
selected.images.forEach(img=>{
gallery+=`<img src="${img}">`;
});
document.getElementById("gallery").innerHTML=gallery;

dname.innerText=selected.name;
dprice.innerText="₹"+selected.price;

let sizeHTML="";
selected.sizes.forEach(s=>{
sizeHTML+=`<option>${s}</option>`;
});
document.getElementById("size").innerHTML=sizeHTML;

let colorHTML="";
selected.colors.forEach(c=>{
colorHTML+=`<option>${c}</option>`;
});
document.getElementById("color").innerHTML=colorHTML;

detail.style.display="block";
}

// ADD PRODUCT
function addProductAuto(){
let name=prompt("Product name");
let price=prompt("Price");
let image=prompt("Image URL");
let cat=prompt("Category (shoes/sneakers/slippers)");
let sizes=prompt("Enter sizes (comma separated ex: 7,8,9)");
let colors=prompt("Enter colors (comma separated ex: Black,White)");

products.push({
name:name,
price:Number(price),
cat:cat||"shoes",
sizes:sizes.split(","),
colors:colors.split(","),
images:[image]
});

saveProducts();
loadProducts();

alert("Product added!");
}

// CLOSE
function closeAll(){
detail.style.display="none";
cartPage.style.display="none";
}

// CART
function addToCart(){
let size=document.getElementById("size").value;
let color=document.getElementById("color").value;
let qty=Number(document.getElementById("qty").value);

let cart=JSON.parse(localStorage.getItem("cart")||"[]");

cart.push({
name:selected.name,
price:selected.price,
size:size,
color:color,
qty:qty
});

localStorage.setItem("cart",JSON.stringify(cart));
alert("Added");
}

// CART VIEW
function openCart(){
cartPage.style.display="block";
loadCart();
}

function loadCart(){
let cart=JSON.parse(localStorage.getItem("cart")||"[]");
let html="";let total=0;

cart.forEach((c,i)=>{
total+=c.price*c.qty;

html+=`${c.name} (${c.size},${c.color}) x${c.qty} = ₹${c.price*c.qty}<br>`;
});

cartItems.innerHTML=html;
total.innerText="Total ₹"+total;
}

// PAYMENT
function payNow(){
window.location.href="upi://pay?pa=9182059866-2@ybl&pn=HarishStore&am="+selected.price;
}

// ORDER (🔥 ADDED LOCATION CHECK ONLY)
function order(){
let name=nameInput.value;
let address=addressInput.value;

// 🚫 Armoor restriction
if(!address.toLowerCase().includes("armoor")){
alert("❌ Delivery only available in Armoor");
return;
}

let cart=JSON.parse(localStorage.getItem("cart")||"[]");

let msg="Order:\n";
cart.forEach(c=>msg+=c.name+" x"+c.qty+"\n");

msg+="\n"+name+"\n"+address;

window.location.href="https://wa.me/9182059866?text="+encodeURIComponent(msg);
}

// INIT
loadProducts();

</script>

</body>
</html>
