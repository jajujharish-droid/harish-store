<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harish Store</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f8}
header{display:flex;justify-content:space-between;padding:15px;background:black;color:white}
.container{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;padding:10px;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,0.1)}
.card img{width:100%;border-radius:10px}
.price{color:green;font-weight:bold}
button{width:100%;padding:10px;margin-top:5px;border:none;border-radius:8px}
.cartBtn{background:orange;color:white}
.orderBtn{background:#25D366;color:white}

.page{
position:fixed;top:0;left:0;width:100%;height:100%;
background:white;display:none;padding:15px;overflow:auto
}

input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ddd}
</style>
</head>

<body>

<header>
<div>🔥 Harish Store</div>
<div onclick="openCart()">🛒</div>
</header>

<input id="search" placeholder="Search..." onkeyup="searchProducts()" style="margin:10px;padding:10px;width:90%">

<div class="container" id="products"></div>

<!-- DETAIL -->
<div id="detailPage" class="page">
<button onclick="closePages()">← Back</button>
<img id="dimg">
<h3 id="dname"></h3>
<p id="dprice"></p>
<button class="cartBtn" onclick="addToCart()">Add to Cart</button>
</div>

<!-- CART -->
<div id="cartPage" class="page">
<button onclick="closePages()">← Back</button>
<h3>Cart</h3>
<div id="cartItems"></div>
<h3 id="total"></h3>

<h3>Details</h3>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="address" placeholder="Address">

<button class="orderBtn" onclick="placeOrder()">Order</button>
</div>

<!-- ADMIN -->
<div id="adminPage" class="page">
<button onclick="closePages()">← Back</button>
<h3>Admin Panel</h3>

<input id="pname" placeholder="Product name">
<input id="pprice" placeholder="Price">
<input id="pimg" placeholder="Image URL">

<button onclick="addProduct()">Add Product</button>
</div>

<script>

// DATA
let products = JSON.parse(localStorage.getItem("products")) || [
{name:"Shoes",price:499,img:"https://images.unsplash.com/photo-1528701800489-20be3c4dbe3c"},
{name:"Sneakers",price:599,img:"https://images.unsplash.com/photo-1600185365926-3a2ce3cdb9eb"}
];

let selected = null;

// LOAD
function loadProducts(){
let html="";
products.forEach((p,i)=>{
html+=`
<div class="card" onclick="openDetail(${i})">
<img src="${p.img}">
<h4>${p.name}</h4>
<p class="price">₹${p.price}</p>
</div>`;
});
document.getElementById("products").innerHTML = html;
localStorage.setItem("products", JSON.stringify(products));
}

// DETAIL
function openDetail(i){
selected = products[i];
document.getElementById("dimg").src = selected.img;
document.getElementById("dname").innerText = selected.name;
document.getElementById("dprice").innerText = "₹"+selected.price;
document.getElementById("detailPage").style.display="block";
}

function closePages(){
document.getElementById("detailPage").style.display="none";
document.getElementById("cartPage").style.display="none";
document.getElementById("adminPage").style.display="none";
}

// CART
function addToCart(){
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let found = cart.find(c=>c.name===selected.name);

if(found){found.qty++} else {cart.push({...selected,qty:1})}

localStorage.setItem("cart", JSON.stringify(cart));
alert("Added to cart");
}

// CART PAGE
function openCart(){
document.getElementById("cartPage").style.display="block";
loadCart();
}

function loadCart(){
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let html=""; let total=0;

cart.forEach((c,i)=>{
total += c.price*c.qty;

html+=`
<div>
${c.name} x${c.qty} = ₹${c.price*c.qty}
<button onclick="changeQty(${i},1)">+</button>
<button onclick="changeQty(${i},-1)">-</button>
</div>`;
});

document.getElementById("cartItems").innerHTML = html;
document.getElementById("total").innerText = "Total: ₹"+total;
}

// QTY
function changeQty(i,val){
let cart = JSON.parse(localStorage.getItem("cart"));
cart[i].qty += val;
if(cart[i].qty<=0) cart.splice(i,1);
localStorage.setItem("cart", JSON.stringify(cart));
loadCart();
}

// ORDER
function placeOrder(){
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let address=document.getElementById("address").value;
let cart = JSON.parse(localStorage.getItem("cart")) || [];

if(!name||!phone||!address||cart.length==0){
alert("Fill all details");
return;
}

let msg="Order:\n";
cart.forEach(c=>{
msg+=`${c.name} x${c.qty}\n`;
});

msg+=`\n${name}\n${phone}\n${address}`;

window.location.href="https://wa.me/9182059866?text="+encodeURIComponent(msg);
}

// ADMIN
document.body.addEventListener("dblclick",()=>{
document.getElementById("adminPage").style.display="block";
});

function addProduct(){
let name=document.getElementById("pname").value;
let price=Number(document.getElementById("pprice").value);
let img=document.getElementById("pimg").value;

if(!name||!price||!img){
alert("Fill properly");
return;
}

products.push({name,price,img});
loadProducts();
alert("Added");
}

// SEARCH
function searchProducts(){
let val=document.getElementById("search").value.toLowerCase();
let html="";

products.forEach((p,i)=>{
if(p.name.toLowerCase().includes(val)){
html+=`
<div class="card" onclick="openDetail(${i})">
<img src="${p.img}">
<h4>${p.name}</h4>
<p class="price">₹${p.price}</p>
</div>`;
}
});

document.getElementById("products").innerHTML = html;
}

// INIT
loadProducts();

</script>

</body>
</html>
