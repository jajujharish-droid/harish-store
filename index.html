<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harish Store</title>

<style>
body{margin:0;font-family:sans-serif;background:#f5f6fa}
header{background:#000;color:#fff;padding:15px;display:flex;justify-content:space-between}

.tabs{
display:flex;overflow:auto;padding:10px;background:#fff
}
.tabs button{
margin-right:10px;padding:8px 12px;border:none;border-radius:20px;background:#ddd
}

.container{
display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px
}

.card{
background:#fff;padding:10px;border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
transition:0.2s;
}
.card:hover{transform:scale(1.03)}
.card img{width:100%;border-radius:10px}

.price{color:green;font-weight:bold}

.page{
position:fixed;top:0;left:0;width:100%;height:100%;
background:#fff;display:none;padding:15px;overflow:auto
}

.close{background:red;color:#fff;padding:8px;border-radius:8px}

.slider{
display:flex;overflow-x:auto;gap:10px
}
.slider img{width:100%;max-width:250px;border-radius:10px}

button{padding:10px;border:none;border-radius:8px;width:100%;margin-top:5px}
.cartBtn{background:orange;color:#fff}
.payBtn{background:#25D366;color:#fff}

</style>
</head>

<body>

<header>
<div>🔥 Harish Store</div>
<div onclick="openCart()">🛒</div>
</header>

<div class="tabs">
<button onclick="filter('all')">All</button>
<button onclick="filter('shoes')">Shoes</button>
<button onclick="filter('sneakers')">Sneakers</button>
<button onclick="filter('slippers')">Slippers</button>
</div>

<div class="container" id="products"></div>

<!-- DETAIL -->
<div id="detail" class="page">
<button class="close" onclick="closeAll()">❌</button>

<div class="slider" id="gallery"></div>

<h2 id="dname"></h2>
<p id="dprice"></p>

<p>Sizes: 7,8,9,10</p>
<p>Colors: Black, White</p>

<button class="cartBtn" onclick="addToCart()">Add to Cart</button>
<button onclick="payNow()">Pay Now</button>
</div>

<!-- CART -->
<div id="cartPage" class="page">
<button class="close" onclick="closeAll()">❌</button>
<h2>Cart</h2>
<div id="cartItems"></div>
<h3 id="total"></h3>

<input id="name" placeholder="Name">
<input id="address" placeholder="Address">

<button class="payBtn" onclick="order()">Order WhatsApp</button>
</div>

<script>

// PRODUCTS
let products=[
{
name:"Shoes",
price:499,
cat:"shoes",
images:[
"https://images.unsplash.com/photo-1528701800489-20be3c4dbe3c",
"https://images.unsplash.com/photo-1542291026-7eec264c27ff"
]
},
{
name:"Sneakers",
price:599,
cat:"sneakers",
images:[
"https://images.unsplash.com/photo-1600185365926-3a2ce3cdb9eb"
]
},
{
name:"Slippers",
price:199,
cat:"slippers",
images:[
"https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a"
]
}
];

let selected=null;

// LOAD
function load(list=products){
let html="";
list.forEach((p,i)=>{
html+=`
<div class="card" onclick="openDetail(${i})">
<img src="${p.images[0]}">
<h4>${p.name}</h4>
<p class="price">₹${p.price}</p>
</div>`;
});
productsDiv.innerHTML=html;
}

// FILTER
function filter(cat){
if(cat=="all") load();
else load(products.filter(p=>p.cat==cat));
}

// DETAIL
function openDetail(i){
selected=products[i];

let gallery="";
selected.images.forEach(img=>{
gallery+=`<img src="${img}">`;
});

document.getElementById("gallery").innerHTML=gallery;
dname.innerText=selected.name;
dprice.innerText="₹"+selected.price;

detail.style.display="block";
}

// CLOSE
function closeAll(){
detail.style.display="none";
cartPage.style.display="none";
}

// CART
function addToCart(){
let cart=JSON.parse(localStorage.getItem("cart")||"[]");

let f=cart.find(c=>c.name==selected.name);
if(f){f.qty++}
else{cart.push({...selected,qty:1})}

localStorage.setItem("cart",JSON.stringify(cart));
alert("Added");
}

// OPEN CART
function openCart(){
cartPage.style.display="block";
loadCart();
}

// LOAD CART
function loadCart(){
let cart=JSON.parse(localStorage.getItem("cart")||"[]");
let html="";let total=0;

cart.forEach((c,i)=>{
total+=c.price*c.qty;

html+=`
<div>
${c.name} x${c.qty}
<button onclick="change(${i},1)">+</button>
<button onclick="change(${i},-1)">-</button>
</div>`;
});

cartItems.innerHTML=html;
total.innerText="Total ₹"+total;
}

// CHANGE QTY
function change(i,v){
let cart=JSON.parse(localStorage.getItem("cart"));
cart[i].qty+=v;
if(cart[i].qty<=0) cart.splice(i,1);
localStorage.setItem("cart",JSON.stringify(cart));
loadCart();
}

// PAY
function payNow(){
window.location.href="upi://pay?pa=9182059866-2@ybl&pn=HarishStore&am="+selected.price;
}

// ORDER
function order(){
let name=document.getElementById("name").value;
let address=document.getElementById("address").value;

let cart=JSON.parse(localStorage.getItem("cart")||"[]");

let msg="Order:\n";
cart.forEach(c=>msg+=c.name+" x"+c.qty+"\n");

msg+="\n"+name+"\n"+address;

window.location.href="https://wa.me/9182059866?text="+encodeURIComponent(msg);
}

// INIT
load();

</script>

</body>
</html>
